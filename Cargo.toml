[workspace]
members = ["daemon"]

[package]
name = "fast6"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fast6"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Registry", "Win32_Foundation"] }

[profile.release]
opt-level = 2
